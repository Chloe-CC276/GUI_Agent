# Default QLoRA config placeholder for GUI Agent SFT.
# Values will be filled when train_lora.py is implemented.
# See docs/MODEL_TUNING_FRAMEWORK.md §5.4

run_name: screenagent_qlora_v0
prompt_version: planner_v0

model:
  # Pick an open-weight Qwen-VL checkpoint compatible with the runtime stack.
  base_model: null  # e.g. Qwen/Qwen2.5-VL-7B-Instruct
  trust_remote_code: true
  torch_dtype: bfloat16
  load_in_4bit: true

data:
  train_file: data/sft/train.jsonl
  validation_file: data/sft/validation.jsonl
  image_root: null  # resolve relative screenshot paths if needed
  max_prompt_chars: 30000
  prefer_corrected_response: true

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  # Vision projector + LLM attention modules; exact names depend on base_model.
  target_modules: null
  bias: none

train:
  output_dir: data/adapters/screenagent_qlora_v0
  num_train_epochs: 1
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 8
  learning_rate: 1.0e-4
  lr_scheduler_type: cosine
  warmup_ratio: 0.03
  logging_steps: 10
  save_steps: 200
  eval_steps: 200
  gradient_checkpointing: true
  max_seq_length: 4096
  seed: 42

eval:
  offline_split: data/sft/validation.jsonl
  metrics:
    - json_ok
    - schema_ok
    - action_type_acc
    - coord_mae
